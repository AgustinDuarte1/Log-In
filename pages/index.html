<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="style.css">
    <script src="login.js" defer></script>
</head>
<body>
    <main>
        <div class="form-container">   
            <h1>Iniciar Sesion</h1>
            <p>Ingresá tus datos para ingresar</p>
            <form id="login">
                <label for="usuario" class="sr-only">Usuario</label>
                <input type="text" name="usuario" id="usuario" placeholder="Nombre de usuario">
                <label for="password" class="sr-only">Contraseña</label>
                <input type="password" name="password" id="password" placeholder="Contraseña">
                <button class="btn-login" type="submit">Iniciar sesión</button>
                <p class="error escondido">Error al iniciar sesión</p>
            </form>
            <p>¿Todavía no tenes una cuenta? - <a href="/register">Registrate</a></p>
        </div>
    </main>
</body>
</html>
